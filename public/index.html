<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 40px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; max-width: 480px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: relative; }
        .status { font-weight: bold; margin-top: 15px; font-size: 1.1em; }
        .connected { color: #4CAF50; }
        .error { color: #f44336; }
        
        .controls-bar { margin-top: 20px; padding-bottom: 20px; border-bottom: 1px solid #333; display: flex; gap: 10px; justify-content: center; }
        .btn { border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95em; }
        .mic-btn { background: #2196F3; color: white; }
        .mic-btn.muted { background: #f44336; }
        .leave-btn { background: #ff9800; color: white; display: none; }

        .peer-list { margin-top: 20px; text-align: left; }
        .peer-item { background: #2a2a2a; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; }
        .peer-item.in-private { border-color: #9c27b0; }
        .peer-header { display: flex; justify-content: space-between; align-items: center; }
        .peer-actions { display: flex; gap: 6px; }
        .peer-controls { display: flex; align-items: center; gap: 10px; }
        .volume-slider { width: 100%; cursor: pointer; }
        .volume-label { font-size: 0.85em; color: #aaa; min-width: 45px; text-align: right; }
        
        .action-btn { border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85em; color: white; }
        .mute-btn { background: #f44336; }
        .mute-btn.muted { background: #4CAF50; }
        .call-btn { background: #9c27b0; }

        .status-badge { font-size: 0.78em; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-private { background: #9c27b0; color: #fff; }
        .badge-main { background: #333; color: #aaa; }

        /* Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #2a2a2a; padding: 25px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .modal-buttons { display: flex; justify-content: space-around; margin-top: 20px; }
        .accept-btn { background: #4CAF50; color: white; }
        .decline-btn { background: #f44336; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="roomTitle">Server Voice Chat</h2>
        <div id="status" class="status">Connecting to voice channel...</div>
        
        <div class="controls-bar">
            <button id="selfMicBtn" class="btn mic-btn" onclick="toggleSelfMic()">Mute My Mic</button>
            <button id="leavePrivateBtn" class="btn leave-btn" onclick="leavePrivateCall()">Return to Main Voice</button>
        </div>

        <div class="peer-list">
            <h3>Connected Players (<span id="playerCount">0</span>)</h3>
            <div id="peersContainer">Waiting for others to join...</div>
        </div>
    </div>

    <!-- Private Call Invite Modal -->
    <div id="inviteModal" class="modal-overlay">
        <div class="modal">
            <h3 style="margin-top:0;">Private Call Request</h3>
            <p><strong id="callerName">Someone</strong> wants to start a private call with you.</p>
            <div class="modal-buttons">
                <button class="btn accept-btn" onclick="acceptCall()">Accept</button>
                <button class="btn decline-btn" onclick="declineCall()">Decline</button>
            </div>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const peersContainer = document.getElementById('peersContainer');
        const selfMicBtn = document.getElementById('selfMicBtn');
        const leavePrivateBtn = document.getElementById('leavePrivateBtn');
        const roomTitle = document.getElementById('roomTitle');
        const inviteModal = document.getElementById('inviteModal');
        const callerNameEl = document.getElementById('callerName');
        const playerCountEl = document.getElementById('playerCount');

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let myUsername = "";
        let localStream = null;
        let socket = null;
        let isSelfMuted = false;
        let activeCallSocketId = null;
        let pendingCallerSocketId = null;
        let privateCallsEnabled = true;

        // socketId -> { pc, username, audioEl, isMuted, volume, inPrivateCall }
        const peers = {};

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        if (!token) {
            statusDiv.className = "status error";
            statusDiv.innerText = "Error: Invalid link. Run /voice in-game.";
        } else {
            fetch('/api/auth/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
            .then(res => res.json())
            .then(async data => {
                if (!data.valid) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Error: Token expired. Run /voice in-game for a new link.";
                    return;
                }

                myUsername = data.username;
                statusDiv.className = "status connected";
                statusDiv.innerText = `Connected as ${myUsername}`;

                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (err) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Microphone access denied!";
                    return;
                }

                socket = io({
                    auth: { username: myUsername }
                });

                socket.on('config_state', (config) => {
                    privateCallsEnabled = config.privateCallsEnabled;
                    updatePeerUI();
                });

                socket.on('all_peers', (peerList) => {
                    peerList.forEach(({ socketId, username }) => {
                        initiatePeerConnection(socketId, username, true);
                    });
                });

                socket.on('peer_joined', ({ username, socketId }) => {
                    initiatePeerConnection(socketId, username, false);
                });

                socket.on('signal', async ({ senderSocketId, senderUsername, signalData }) => {
                    if (!peers[senderSocketId]) {
                        initiatePeerConnection(senderSocketId, senderUsername, false);
                    }

                    const pc = peers[senderSocketId].pc;

                    try {
                        if (signalData.sdp) {
                            await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp));
                            if (signalData.sdp.type === 'offer') {
                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);
                                socket.emit('signal', {
                                    targetSocketId: senderSocketId,
                                    signalData: { sdp: pc.localDescription }
                                });
                            }
                        } else if (signalData.candidate) {
                            await pc.addIceCandidate(new RTCIceCandidate(signalData.candidate));
                        }
                    } catch (e) {
                        console.error("Signaling error:", e);
                    }
                });

                // Private Call Handlers
                socket.on('call_invite', ({ senderSocketId, senderUsername }) => {
                    if (!privateCallsEnabled) return;
                    pendingCallerSocketId = senderSocketId;
                    callerNameEl.innerText = senderUsername;
                    inviteModal.style.display = 'flex';
                });

                socket.on('call_accepted', ({ targetSocketId }) => {
                    startPrivateSession(targetSocketId);
                });

                socket.on('call_declined', () => {
                    alert('Private call request was declined.');
                });

                socket.on('call_error', ({ message }) => {
                    alert(message);
                });

                socket.on('private_call_ended', ({ socketId }) => {
                    if (activeCallSocketId === socketId) {
                        endPrivateSession();
                        alert('Private call ended.');
                    }
                });

                socket.on('player_status_change', ({ socketId, inPrivateCall }) => {
                    if (peers[socketId]) {
                        peers[socketId].inPrivateCall = inPrivateCall;
                        updatePeerUI();
                    }
                });

                socket.on('peer_left', ({ socketId }) => {
                    if (peers[socketId]) {
                        if (peers[socketId].audioEl) peers[socketId].audioEl.remove();
                        peers[socketId].pc.close();
                        delete peers[socketId];
                        if (activeCallSocketId === socketId) {
                            endPrivateSession();
                        }
                        updatePeerUI();
                    }
                });
            })
            .catch(() => {
                statusDiv.className = "status error";
                statusDiv.innerText = "Server connection error.";
            });
        }

        function requestPrivateCall(targetSocketId) {
            if (!privateCallsEnabled) {
                alert('Private calls are currently disabled.');
                return;
            }
            if (activeCallSocketId) {
                alert('You are already in a private call.');
                return;
            }
            socket.emit('request_private_call', { targetSocketId });
            alert('Private call invite sent!');
        }

        function acceptCall() {
            inviteModal.style.display = 'none';
            if (pendingCallerSocketId) {
                socket.emit('accept_private_call', { targetSocketId: pendingCallerSocketId });
                startPrivateSession(pendingCallerSocketId);
                pendingCallerSocketId = null;
            }
        }

        function declineCall() {
            inviteModal.style.display = 'none';
            if (pendingCallerSocketId) {
                socket.emit('decline_private_call', { targetSocketId: pendingCallerSocketId });
                pendingCallerSocketId = null;
            }
        }

        function startPrivateSession(targetSocketId) {
            activeCallSocketId = targetSocketId;
            leavePrivateBtn.style.display = 'inline-block';
            const partnerName = peers[targetSocketId]?.username || 'User';
            roomTitle.innerText = `Private Call w/ ${partnerName}`;
            applyPrivateAudioFiltering();
            updatePeerUI();
        }

        function leavePrivateCall() {
            if (activeCallSocketId) {
                socket.emit('end_private_call', { targetSocketId: activeCallSocketId });
                endPrivateSession();
            }
        }

        function endPrivateSession() {
            activeCallSocketId = null;
            leavePrivateBtn.style.display = 'none';
            roomTitle.innerText = 'Server Voice Chat';
            applyPrivateAudioFiltering();
            updatePeerUI();
        }

        function applyPrivateAudioFiltering() {
            Object.keys(peers).forEach(sId => {
                const peer = peers[sId];
                if (peer && peer.audioEl) {
                    if (activeCallSocketId) {
                        peer.audioEl.muted = (sId !== activeCallSocketId) || peer.isMuted;
                    } else {
                        peer.audioEl.muted = peer.isMuted;
                    }
                }
            });
        }

        function toggleSelfMic() {
            if (!localStream) return;
            isSelfMuted = !isSelfMuted;
            
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isSelfMuted;
            });

            if (isSelfMuted) {
                selfMicBtn.innerText = "Unmute My Mic";
                selfMicBtn.classList.add('muted');
            } else {
                selfMicBtn.innerText = "Mute My Mic";
                selfMicBtn.classList.remove('muted');
            }
        }

        function initiatePeerConnection(targetSocketId, targetUsername, isInitiator) {
            if (peers[targetSocketId]) return;

            const pc = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', {
                        targetSocketId: targetSocketId,
                        signalData: { candidate: event.candidate }
                    });
                }
            };

            pc.ontrack = (event) => {
                let audio = document.getElementById(`audio-${targetSocketId}`);
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = `audio-${targetSocketId}`;
                    audio.autoplay = true;
                    document.body.appendChild(audio);
                }
                audio.srcObject = event.streams[0];

                peers[targetSocketId].audioEl = audio;
                applyPrivateAudioFiltering();
                updatePeerUI();
            };

            peers[targetSocketId] = {
                pc: pc,
                username: targetUsername,
                audioEl: null,
                isMuted: false,
                volume: 1.0,
                inPrivateCall: false
            };

            updatePeerUI();

            if (isInitiator) {
                pc.createOffer().then(offer => {
                    return pc.setLocalDescription(offer);
                }).then(() => {
                    socket.emit('signal', {
                        targetSocketId: targetSocketId,
                        signalData: { sdp: pc.localDescription }
                    });
                });
            }
        }

        function toggleMutePeer(socketId) {
            if (peers[socketId]) {
                peers[socketId].isMuted = !peers[socketId].isMuted;
                applyAudioSettings(socketId);
                updatePeerUI();
            }
        }

        function setPeerVolume(socketId, val) {
            if (peers[socketId]) {
                peers[socketId].volume = parseFloat(val);
                applyAudioSettings(socketId);
                const label = document.getElementById(`vol-label-${socketId}`);
                if (label) label.innerText = `${Math.round(val * 100)}%`;
            }
        }

        function applyAudioSettings(socketId) {
            const peer = peers[socketId];
            if (peer && peer.audioEl) {
                if (activeCallSocketId) {
                    peer.audioEl.muted = (socketId !== activeCallSocketId) || peer.isMuted;
                } else {
                    peer.audioEl.muted = peer.isMuted;
                }
                peer.audioEl.volume = Math.min(1.0, peer.volume);
            }
        }

        function updatePeerUI() {
            const peerList = Object.entries(peers);
            playerCountEl.innerText = peerList.length;

            if (peerList.length === 0) {
                peersContainer.innerHTML = "<span style='color:#aaa;'>Waiting for others to join...</span>";
                return;
            }

            peersContainer.innerHTML = peerList.map(([sId, peer]) => {
                const isPrivatePartner = activeCallSocketId === sId;
                const statusBadge = peer.inPrivateCall
                    ? `<span class="status-badge badge-private">In Private Call</span>`
                    : `<span class="status-badge badge-main">Main Voice</span>`;

                const showCallButton = privateCallsEnabled && !activeCallSocketId && !peer.inPrivateCall;

                return `
                    <div class="peer-item ${peer.inPrivateCall ? 'in-private' : ''}">
                        <div class="peer-header">
                            <div>
                                <strong>${peer.username}</strong> ${statusBadge}
                            </div>
                            <div class="peer-actions">
                                ${showCallButton ? `<button class="action-btn call-btn" onclick="requestPrivateCall('${sId}')">Call Privately</button>` : ''}
                                <button class="action-btn mute-btn ${peer.isMuted ? 'muted' : ''}" onclick="toggleMutePeer('${sId}')">
                                    ${peer.isMuted ? 'Unmute' : 'Mute'}
                                </button>
                            </div>
                        </div>
                        <div class="peer-controls">
                            <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="${peer.volume}" oninput="setPeerVolume('${sId}', this.value)">
                            <span id="vol-label-${sId}" class="volume-label">${Math.round(peer.volume * 100)}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
