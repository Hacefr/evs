<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Service Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f1117;
            --panel-bg: #181b23;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #272a36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .mic-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .mic-indicator.recording {
            color: var(--accent-green);
        }

        .mic-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .mic-indicator.recording .mic-dot {
            background-color: var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 300px;
            min-height: 380px;
        }

        .main-panel {
            padding: 20px;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-panel {
            padding: 20px;
            background: rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .player-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background-color: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--text-main);
        }

        .player-details h4 {
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .player-details p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .roster-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }

        .control-dock {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 16px 24px;
            background-color: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="top-bar">
            <div class="user-info">
                <div class="status-badge">
                    <div class="status-dot"></div>
                    Connected
                </div>
                <span id="playerUsername" style="font-weight: 600; font-size: 0.95rem;">Player</span>
            </div>

            <div class="mic-indicator" id="micIndicator">
                <div class="mic-dot"></div>
                <span id="micStatusText">Initializing Audio...</span>
            </div>
        </div>

        <div class="content">
            <div class="main-panel">
                <div class="section-title">Active Voice Peers</div>
                <div class="player-list" id="nearbyPlayerList">
                    <!-- Populated dynamically via JavaScript WebRTC connections -->
                </div>
            </div>

            <div class="sidebar-panel">
                <div class="section-title">Connected Roster</div>
                <div id="globalRoster"></div>
            </div>
        </div>

        <div class="control-dock">
            <button class="btn" id="startAudioBtn" onclick="initAudio()">Enable Microphone</button>
            <button class="btn" id="muteBtn" onclick="toggleMute()">Mute Mic</button>
            <button class="btn btn-danger" onclick="destroySession()">Disconnect Session</button>
        </div>
    </div>

    <!-- Hidden element container for dynamically created peer audio tracks -->
    <div id="audioContainer" style="display:none;"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user') || 'User_' + Math.floor(Math.random() * 1000);
        document.getElementById('playerUsername').innerText = username;

        let localStream = null;
        let ws = null;
        let peerConnections = {};
        let isMuted = false;

        const myPosition = { x: 0, y: 0, z: 0, world: 'world' };

        // Connect WebSocket Signaling Server
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', username: username }));
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                switch(data.type) {
                    case 'roster':
                        updateRosterUI(data.users);
                        data.users.forEach(peer => {
                            if (peer !== username && !peerConnections[peer]) {
                                createPeerConnection(peer, true);
                            }
                        });
                        break;

                    case 'signal':
                        handleSignalData(data.sender, data.signalData);
                        break;

                    case 'position_update':
                        handlePeerPosition(data);
                        break;
                }
            };
        }

        // Initialize WebRTC Microphone Access
        async function initAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                document.getElementById('micIndicator').classList.add('recording');
                document.getElementById('micStatusText').innerText = 'Microphone Active';
                document.getElementById('startAudioBtn').style.display = 'none';

                // Attach microphone tracks to existing peer connections
                Object.keys(peerConnections).forEach(peer => {
                    localStream.getTracks().forEach(track => {
                        peerConnections[peer].addTrack(track, localStream);
                    });
                });
            } catch (err) {
                alert('Microphone access denied or unavailable.');
            }
        }

        // Create WebRTC Peer Connection
        function createPeerConnection(targetUser, isInitiator) {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            peerConnections[targetUser] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: 'signal',
                        target: targetUser,
                        signalData: { candidate: event.candidate }
                    }));
                }
            };

            pc.ontrack = (event) => {
                let audioEl = document.getElementById(`audio-${targetUser}`);
                if (!audioEl) {
                    audioEl = document.createElement('audio');
                    audioEl.id = `audio-${targetUser}`;
                    audioEl.autoplay = true;
                    document.getElementById('audioContainer').appendChild(audioEl);
                }
                audioEl.srcObject = event.streams[0];
                addPlayerCard(targetUser);
            };

            if (isInitiator) {
                pc.onnegotiationneeded = async () => {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    ws.send(JSON.stringify({
                        type: 'signal',
                        target: targetUser,
                        signalData: { sdp: pc.localDescription }
                    }));
                };
            }
        }

        async function handleSignalData(sender, signalData) {
            if (!peerConnections[sender]) {
                createPeerConnection(sender, false);
            }

            const pc = peerConnections[sender];

            if (signalData.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp));
                if (signalData.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    ws.send(JSON.stringify({
                        type: 'signal',
                        target: sender,
                        signalData: { sdp: pc.localDescription }
                    }));
                }
            } else if (signalData.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(signalData.candidate));
            }
        }

        // Distance & World Audio Calculations
        function handlePeerPosition(data) {
            const audioEl = document.getElementById(`audio-${data.username}`);
            if (!audioEl) return;

            // Separate dimensions: Mute if in different worlds
            if (data.world !== myPosition.world) {
                audioEl.volume = 0;
                return;
            }

            const dx = data.x - myPosition.x;
            const dy = data.y - myPosition.y;
            const dz = data.z - myPosition.z;
            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

            // Attenuate volume over a 30-block spatial radius
            const maxDistance = 30;
            if (distance > maxDistance) {
                audioEl.volume = 0;
            } else {
                audioEl.volume = 1 - (distance / maxDistance);
            }
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            const btn = document.getElementById('muteBtn');
            btn.classList.toggle('btn-danger', isMuted);
            btn.innerText = isMuted ? 'Unmute Mic' : 'Mute Mic';
        }

        function destroySession() {
            // Stop local microphone hardware access
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            // Close WebRTC peer streams
            Object.keys(peerConnections).forEach(peer => {
                peerConnections[peer].close();
            });

            // Close active WebSocket connection
            if (ws) {
                ws.close();
            }

            // Redirect to root without auth parameters to hit fake 404 page
            window.location.href = window.location.origin;
        }

        function updateRosterUI(users) {
            const container = document.getElementById('globalRoster');
            container.innerHTML = '';
            users.forEach(u => {
                const item = document.createElement('div');
                item.className = 'roster-item';
                item.innerHTML = `<span>${u}</span>`;
                container.appendChild(item);
            });
        }

        function addPlayerCard(user) {
            const list = document.getElementById('nearbyPlayerList');
            if (document.getElementById(`card-${user}`)) return;

            const card = document.createElement('div');
            card.className = 'player-card';
            card.id = `card-${user}`;
            card.innerHTML = `
                <div class="player-meta">
                    <div class="avatar">${user.charAt(0).toUpperCase()}</div>
                    <div class="player-details">
                        <h4>${user}</h4>
                        <p>Voice Connected</p>
                    </div>
                </div>
            `;
            list.appendChild(card);
        }

        connectWebSocket();
    </script>
</body>
</html>
