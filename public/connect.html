<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proximity Voice Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; max-width: 400px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .status { font-weight: bold; margin-top: 15px; font-size: 1.1em; }
        .connected { color: #4CAF50; }
        .error { color: #f44336; }
        .active-users { margin-top: 20px; font-size: 0.9em; color: #aaa; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Proximity Voice Chat</h2>
        <div id="status" class="status">Connecting to voice channel...</div>
        <div id="peers" class="active-users">Connected Players: None</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const peersDiv = document.getElementById('peers');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let myUsername = "";
        let myPosition = { x: 0, y: 0, z: 0, world: "world" };
        const peers = {}; // socketId -> { peer, username, audioEl, position }
        const positions = {}; // username -> { x, y, z, world }
        let localStream = null;

        if (!token) {
            statusDiv.className = "status error";
            statusDiv.innerText = "Error: Invalid link. Run /voice in-game.";
        } else {
            fetch('/api/auth/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
            .then(res => res.json())
            .then(async data => {
                if (!data.valid) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Error: Token expired. Run /voice in-game for a new link.";
                    return;
                }

                myUsername = data.username;
                statusDiv.className = "status connected";
                statusDiv.innerText = `Connected as ${myUsername}`;

                // Request Microphone Access
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (err) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Microphone access denied!";
                    return;
                }

                const socket = io({
                    auth: { username: myUsername }
                });

                // Socket WebRTC Handshake
                socket.on('peer_joined', ({ username, socketId }) => {
                    createPeer(socket, socketId, username, true);
                });

                socket.on('signal', ({ senderSocketId, senderUsername, signalData }) => {
                    if (!peers[senderSocketId]) {
                        createPeer(socket, senderSocketId, senderUsername, false);
                    }
                    peers[senderSocketId].peer.signal(signalData);
                });

                socket.on('peer_left', ({ socketId }) => {
                    if (peers[socketId]) {
                        if (peers[socketId].audioEl) peers[socketId].audioEl.remove();
                        peers[socketId].peer.destroy();
                        delete peers[socketId];
                        updatePeerList();
                    }
                });

                socket.on('position_update', ({ username, position }) => {
                    positions[username] = position;
                    if (username === myUsername) {
                        myPosition = position;
                    }
                    updateProximityAudio();
                });
            })
            .catch(() => {
                statusDiv.className = "status error";
                statusDiv.innerText = "Server connection error.";
            });
        }

        function createPeer(socket, targetSocketId, targetUsername, initiator) {
            const peer = new SimplePeer({
                initiator: initiator,
                stream: localStream,
                trickle: false
            });

            peer.on('signal', (signalData) => {
                socket.emit('signal', { targetSocketId, signalData });
            });

            peer.on('stream', (stream) => {
                const audio = document.createElement('audio');
                audio.srcObject = stream;
                audio.autoplay = true;
                document.body.appendChild(audio);

                peers[targetSocketId] = {
                    peer: peer,
                    username: targetUsername,
                    audioEl: audio
                };
                updatePeerList();
            });
        }

        function updatePeerList() {
            const activeList = Object.values(peers).map(p => p.username);
            peersDiv.innerText = activeList.length > 0 
                ? "Active Players: " + activeList.join(", ") 
                : "Connected Players: Waiting for others...";
        }

        function updateProximityAudio() {
            const MAX_DISTANCE = 30; // Blocks away before silent

            Object.values(peers).forEach(p => {
                const targetPos = positions[p.username];
                if (!targetPos || targetPos.world !== myPosition.world) {
                    p.audioEl.volume = 0;
                    return;
                }

                const dx = targetPos.x - myPosition.x;
                const dy = targetPos.y - myPosition.y;
                const dz = targetPos.z - myPosition.z;
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (distance >= MAX_DISTANCE) {
                    p.audioEl.volume = 0;
                } else {
                    // Linear drop-off from 100% volume down to 0% at 30 blocks
                    p.audioEl.volume = Math.max(0, 1 - (distance / MAX_DISTANCE));
                }
            });
        }
    </script>
</body>
</html>
