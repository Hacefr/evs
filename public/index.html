<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proximity Voice Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .dashboard { width: 100%; max-width: 900px; background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #333; padding-bottom: 16px; }
        .status-badge { background-color: #1b4332; color: #52b788; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background-color: #52b788; border-radius: 50%; }
        .user-name { font-size: 1.2rem; font-weight: bold; margin-left: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .card { background-color: #252525; border: 1px solid #3a3a3a; border-radius: 6px; padding: 16px; min-height: 250px; }
        .card-title { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        ul { list-style: none; }
        li { background-color: #2a2a2a; padding: 10px 14px; border-radius: 4px; margin-bottom: 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .controls { display: flex; gap: 12px; justify-content: flex-end; }
        button { background-color: #333; color: white; border: 1px solid #555; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #444; }
        button.danger { background-color: #721c24; border-color: #f5c6cb; color: #f8d7da; }
        button.danger:hover { background-color: #842029; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div>
            <span class="status-badge"><span class="status-dot"></span> <span id="conn-status">Connected</span></span>
            <span class="user-name" id="user-display">Loading...</span>
        </div>
        <div style="color: #52b788; font-weight: bold; font-size: 0.9rem;" id="mic-status">
            ● Checking Microphone...
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-title">Active Voice Peers</div>
            <ul id="active-peers">
                <!-- Dynamically populated when audio stream is active -->
            </ul>
        </div>
        <div class="card">
            <div class="card-title">Connected Roster</div>
            <ul id="roster-list">
                <!-- Dynamically populated via WebSocket roster broadcast -->
            </ul>
        </div>
    </div>

    <div class="controls">
        <button id="mute-btn" onclick="toggleMute()">Mute Mic</button>
        <button class="danger" onclick="disconnectSession()">Disconnect Session</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('user') || 'Anonymous';
    document.getElementById('user-display').innerText = username;

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}?user=${username}`);

    let localStream = null;
    let isMuted = false;
    const peerConnections = {};

    // 1. Get Microphone Access
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(stream => {
            localStream = stream;
            document.getElementById('mic-status').innerHTML = '● Microphone Active';
        })
        .catch(err => {
            console.error("Mic access denied:", err);
            document.getElementById('mic-status').style.color = '#dc3545';
            document.getElementById('mic-status').innerHTML = '● Mic Access Denied';
        });

    // 2. Handle Signaling & Roster Events
    ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        // Update Roster UI when player list changes
        if (data.type === 'roster') {
            const rosterList = document.getElementById('roster-list');
            rosterList.innerHTML = '';
            
            data.players.filter(p => p !== username).forEach(peer => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${peer}</span> <span style="font-size:0.75rem; color:#888;">Online</span>`;
                rosterList.appendChild(li);

                // Initiate WebRTC call to newly discovered peer
                if (!peerConnections[peer]) {
                    createPeerConnection(peer, true);
                }
            });
        }

        // WebRTC Signaling Handler
        if (data.sender) {
            if (!peerConnections[data.sender]) {
                createPeerConnection(data.sender, false);
            }
            const pc = peerConnections[data.sender];

            if (data.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({ target: data.sender, type: 'answer', payload: answer }));
            } else if (data.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
            } else if (data.type === 'candidate') {
                await pc.addIceCandidate(new RTCIceCandidate(data.payload));
            }
        }
    };

    // 3. Establish Peer-to-Peer WebRTC Audio Streaming
    function createPeerConnection(peer, isInitiator) {
        const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });
        peerConnections[peer] = pc;

        if (localStream) {
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        // Output incoming voice audio stream
        pc.ontrack = (event) => {
            let audio = document.getElementById(`audio-${peer}`);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = `audio-${peer}`;
                audio.autoplay = true;
                document.body.appendChild(audio);
            }
            audio.srcObject = event.streams[0];

            // Add player to Active Voice Peers UI
            const activeList = document.getElementById('active-peers');
            if (!document.getElementById(`peer-card-${peer}`)) {
                const li = document.createElement('li');
                li.id = `peer-card-${peer}`;
                li.innerHTML = `<span>${peer}</span> <span style="font-size:0.75rem; color:#52b788;">Streaming Audio</span>`;
                activeList.appendChild(li);
            }
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({ target: peer, type: 'candidate', payload: event.candidate }));
            }
        };

        if (isInitiator) {
            pc.createOffer().then(offer => {
                pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ target: peer, type: 'offer', payload: offer }));
            });
        }
    }

    // Controls
    function toggleMute() {
        if (!localStream) return;
        isMuted = !isMuted;
        localStream.getAudioTracks()[0].enabled = !isMuted;
        const btn = document.getElementById('mute-btn');
        btn.innerText = isMuted ? 'Unmute Mic' : 'Mute Mic';
        btn.style.backgroundColor = isMuted ? '#856404' : '#333';
    }

    function disconnectSession() {
        if (ws) ws.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        document.body.innerHTML = '<h2 style="color:white; text-align:center; margin-top:20%;">Session Disconnected</h2>';
    }
</script>

</body>
</html>
