<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Service Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f1117;
            --panel-bg: #181b23;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #272a36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .mic-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .mic-indicator.recording {
            color: var(--accent-green);
        }

        .mic-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .mic-indicator.recording .mic-dot {
            background-color: var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
        }

        /* Content Layout */
        .content {
            display: grid;
            grid-template-columns: 1fr 300px;
            min-height: 380px;
        }

        .main-panel {
            padding: 20px;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-panel {
            padding: 20px;
            background: rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 700;
        }

        /* Player Cards */
        .player-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: border-color 0.2s;
        }

        .player-card.speaking {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.03);
        }

        .player-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background-color: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--text-main);
        }

        .player-details h4 {
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .player-details p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Audio Visualizer Bar */
        .audio-bar {
            width: 60px;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .audio-level {
            height: 100%;
            width: 0%;
            background: var(--accent-green);
            transition: width 0.1s ease;
        }

        .player-card.speaking .audio-level {
            width: 75%;
        }

        /* Global Roster */
        .roster-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }

        .roster-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-in-range {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .badge-far {
            background: rgba(156, 163, 175, 0.15);
            color: var(--text-muted);
        }

        /* Control Dock */
        .control-dock {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 16px 24px;
            background-color: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border-color);
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        .btn-active-danger {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .btn-active-danger:hover {
            background-color: rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="user-info">
                <div class="status-badge">
                    <div class="status-dot"></div>
                    Connected
                </div>
                <span id="playerUsername" style="font-weight: 600; font-size: 0.95rem;">Player</span>
            </div>

            <div class="mic-indicator recording" id="micIndicator">
                <div class="mic-dot"></div>
                <span id="micStatusText">Recording Active</span>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(this)">Proximity Voice</button>
            <button class="tab-btn" onclick="switchTab(this)">Text & Group Chat</button>
        </div>

        <!-- Content Area -->
        <div class="content">
            <!-- Main Panel: Nearby Speakers -->
            <div class="main-panel">
                <div class="section-title">Nearby Players (Spatial Range: 30 Blocks)</div>
                <div class="player-list" id="nearbyPlayerList">
                    
                    <!-- Placeholder Player Card -->
                    <div class="player-card speaking">
                        <div class="player-meta">
                            <div class="avatar" style="background-color: #3b82f6;">A</div>
                            <div class="player-details">
                                <h4>Alex_Craft</h4>
                                <p>4 blocks away • Left Ear</p>
                            </div>
                        </div>
                        <div class="audio-bar">
                            <div class="audio-level"></div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Sidebar: Global Server Voice Roster -->
            <div class="sidebar-panel">
                <div class="section-title">Connected Roster</div>
                <div id="globalRoster">
                    <div class="roster-item">
                        <span>Alex_Craft</span>
                        <span class="roster-badge badge-in-range">In Range</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control Dock -->
        <div class="control-dock">
            <button class="btn" id="muteBtn" onclick="toggleMute()">
                <span id="muteLabel">Mute Mic</span>
            </button>
            <button class="btn" id="deafenBtn" onclick="toggleDeafen()">
                <span id="deafenLabel">Deafen Audio</span>
            </button>
            <button class="btn" onclick="alert('Mic sensitivity auto-calibrated.')">
                Settings
            </button>
        </div>
    </div>

    <script>
        let isMuted = false;
        let isDeafened = false;

        // Auto-grab player username from query string if present (e.g. ?user=Steve)
        const urlParams = new URLSearchParams(window.location.search);
        const user = urlParams.get('user');
        if (user) {
            document.getElementById('playerUsername').innerText = user;
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('muteBtn');
            const label = document.getElementById('muteLabel');
            const indicator = document.getElementById('micIndicator');
            const statusText = document.getElementById('micStatusText');

            if (isMuted) {
                btn.classList.add('btn-active-danger');
                label.innerText = 'Unmute Mic';
                indicator.classList.remove('recording');
                statusText.innerText = 'Microphone Muted';
            } else {
                btn.classList.remove('btn-active-danger');
                label.innerText = 'Mute Mic';
                indicator.classList.add('recording');
                statusText.innerText = 'Recording Active';
            }
        }

        function toggleDeafen() {
            isDeafened = !isDeafened;
            const btn = document.getElementById('deafenBtn');
            const label = document.getElementById('deafenLabel');

            if (isDeafened) {
                btn.classList.add('btn-active-danger');
                label.innerText = 'Undeafen Audio';
            } else {
                btn.classList.remove('btn-active-danger');
                label.innerText = 'Deafen Audio';
            }
        }

        function switchTab(element) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
