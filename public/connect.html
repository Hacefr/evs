<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 40px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; max-width: 480px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .status { font-weight: bold; margin-top: 15px; font-size: 1.1em; }
        .connected { color: #4CAF50; }
        .error { color: #f44336; }
        .controls-bar { margin-top: 20px; padding-bottom: 20px; border-bottom: 1px solid #333; display: flex; gap: 10px; justify-content: center; }
        .btn { border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95em; }
        .mic-btn { background: #2196F3; color: white; }
        .mic-btn.muted { background: #f44336; }
        .peer-list { margin-top: 20px; text-align: left; }
        .peer-item { background: #2a2a2a; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Server Voice Chat</h2>
        <div id="status" class="status">Connecting to voice channel...</div>
        
        <div class="controls-bar">
            <button id="selfMicBtn" class="btn mic-btn" onclick="toggleSelfMic()">Mute My Mic</button>
        </div>

        <div class="peer-list">
            <h3>Connected Players</h3>
            <div id="peersContainer">Waiting for others to join...</div>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const peersContainer = document.getElementById('peersContainer');
        const selfMicBtn = document.getElementById('selfMicBtn');
        
        const urlParams = new URLSearchParams(window.location.search);
        const userParam = urlParams.get('user');
        const secretParam = urlParams.get('secret');

        const EXPECTED_SECRET = "MY_SUPER_SECRET_KEY_123";

        let myUsername = userParam || "";
        let localStream = null;
        let socket = null;
        let isSelfMuted = false;
        const peers = {};

        if (!userParam || secretParam !== EXPECTED_SECRET) {
            statusDiv.className = "status error";
            statusDiv.innerText = "Error: Invalid link. Run /voice in-game.";
        } else {
            startVoiceSession();
        }

        async function startVoiceSession() {
            statusDiv.className = "status connected";
            statusDiv.innerText = `Connected as ${myUsername}`;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                statusDiv.className = "status error";
                statusDiv.innerText = "Microphone access denied!";
                return;
            }

            socket = io({
                auth: { username: myUsername }
            });

            socket.on('all_peers', (peerList) => {
                peerList.forEach(({ socketId, username }) => {
                    initiatePeerConnection(socketId, username, true);
                });
            });

            socket.on('peer_joined', ({ username, socketId }) => {
                initiatePeerConnection(socketId, username, false);
            });

            socket.on('signal', async ({ senderSocketId, senderUsername, signalData }) => {
                if (!peers[senderSocketId]) {
                    initiatePeerConnection(senderSocketId, senderUsername, false);
                }
                const pc = peers[senderSocketId].pc;
                try {
                    if (signalData.sdp) {
                        await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp));
                        if (signalData.sdp.type === 'offer') {
                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(answer);
                            socket.emit('signal', {
                                targetSocketId: senderSocketId,
                                signalData: { sdp: pc.localDescription }
                            });
                        }
                    } else if (signalData.candidate) {
                        await pc.addIceCandidate(new RTCIceCandidate(signalData.candidate));
                    }
                } catch (e) {
                    console.error("Signaling error:", e);
                }
            });

            socket.on('peer_left', ({ socketId }) => {
                if (peers[socketId]) {
                    if (peers[socketId].audioEl) peers[socketId].audioEl.remove();
                    peers[socketId].pc.close();
                    delete peers[socketId];
                    updatePeerUI();
                }
            });
        }

        function toggleSelfMic() {
            if (!localStream) return;
            isSelfMuted = !isSelfMuted;
            localStream.getAudioTracks().forEach(track => { track.enabled = !isSelfMuted; });
            selfMicBtn.innerText = isSelfMuted ? "Unmute My Mic" : "Mute My Mic";
            selfMicBtn.classList.toggle('muted', isSelfMuted);
        }

        function initiatePeerConnection(targetSocketId, targetUsername, isInitiator) {
            if (peers[targetSocketId]) return;
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { targetSocketId, signalData: { candidate: e.candidate } });
            };

            pc.ontrack = (e) => {
                let audio = document.getElementById(`audio-${targetSocketId}`) || document.createElement('audio');
                audio.id = `audio-${targetSocketId}`;
                audio.autoplay = true;
                audio.srcObject = e.streams[0];
                document.body.appendChild(audio);
                peers[targetSocketId].audioEl = audio;
            };

            peers[targetSocketId] = { pc, username: targetUsername };
            updatePeerUI();

            if (isInitiator) {
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                    socket.emit('signal', { targetSocketId, signalData: { sdp: pc.localDescription } });
                });
            }
        }

        function updatePeerUI() {
            const list = Object.values(peers);
            peersContainer.innerHTML = list.length === 0 
                ? "<span style='color:#aaa;'>Waiting for others to join...</span>"
                : list.map(p => `<div class="peer-item"><strong>${p.username}</strong></div>`).join('');
        }
    </script>
</body>
</html>
