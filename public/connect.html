<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 40px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; max-width: 480px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .status { font-weight: bold; margin-top: 15px; font-size: 1.1em; }
        .connected { color: #4CAF50; }
        .error { color: #f44336; }
        
        .controls-bar { margin-top: 20px; padding-bottom: 20px; border-bottom: 1px solid #333; }
        .mic-btn { background: #2196F3; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .mic-btn.muted { background: #f44336; }

        .peer-list { margin-top: 20px; text-align: left; }
        .peer-item { background: #2a2a2a; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .peer-header { display: flex; justify-content: space-between; align-items: center; }
        .peer-controls { display: flex; align-items: center; gap: 10px; }
        .volume-slider { width: 100%; cursor: pointer; }
        .volume-label { font-size: 0.85em; color: #aaa; min-width: 45px; text-align: right; }
        .mute-btn { background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85em; }
        .mute-btn.muted { background: #4CAF50; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Server Voice Chat</h2>
        <div id="status" class="status">Connecting to voice channel...</div>
        
        <div class="controls-bar">
            <button id="selfMicBtn" class="mic-btn" onclick="toggleSelfMic()">Mute My Mic</button>
        </div>

        <div class="peer-list">
            <h3>Connected Players</h3>
            <div id="peersContainer">Waiting for others to join...</div>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const peersContainer = document.getElementById('peersContainer');
        const selfMicBtn = document.getElementById('selfMicBtn');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let myUsername = "";
        let localStream = null;
        let socket = null;
        let isSelfMuted = false;

        // socketId -> { pc, username, audioEl, isMuted, volume }
        const peers = {};

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        if (!token) {
            statusDiv.className = "status error";
            statusDiv.innerText = "Error: Invalid link. Run /voice in-game.";
        } else {
            fetch('/api/auth/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
            .then(res => res.json())
            .then(async data => {
                if (!data.valid) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Error: Token expired. Run /voice in-game for a new link.";
                    return;
                }

                myUsername = data.username;
                statusDiv.className = "status connected";
                statusDiv.innerText = `Connected as ${myUsername}`;

                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (err) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Microphone access denied!";
                    return;
                }

                socket = io({
                    auth: { username: myUsername }
                });

                socket.on('all_peers', (peerList) => {
                    peerList.forEach(({ socketId, username }) => {
                        initiatePeerConnection(socketId, username, true);
                    });
                });

                socket.on('peer_joined', ({ username, socketId }) => {
                    initiatePeerConnection(socketId, username, false);
                });

                socket.on('signal', async ({ senderSocketId, senderUsername, signalData }) => {
                    if (!peers[senderSocketId]) {
                        initiatePeerConnection(senderSocketId, senderUsername, false);
                    }

                    const pc = peers[senderSocketId].pc;

                    try {
                        if (signalData.sdp) {
                            await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp));
                            if (signalData.sdp.type === 'offer') {
                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);
                                socket.emit('signal', {
                                    targetSocketId: senderSocketId,
                                    signalData: { sdp: pc.localDescription }
                                });
                            }
                        } else if (signalData.candidate) {
                            await pc.addIceCandidate(new RTCIceCandidate(signalData.candidate));
                        }
                    } catch (e) {
                        console.error("Signaling error:", e);
                    }
                });

                socket.on('peer_left', ({ socketId }) => {
                    if (peers[socketId]) {
                        if (peers[socketId].audioEl) peers[socketId].audioEl.remove();
                        peers[socketId].pc.close();
                        delete peers[socketId];
                        updatePeerUI();
                    }
                });
            })
            .catch(() => {
                statusDiv.className = "status error";
                statusDiv.innerText = "Server connection error.";
            });
        }

        function toggleSelfMic() {
            if (!localStream) return;
            isSelfMuted = !isSelfMuted;
            
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isSelfMuted;
            });

            if (isSelfMuted) {
                selfMicBtn.innerText = "Unmute My Mic";
                selfMicBtn.classList.add('muted');
            } else {
                selfMicBtn.innerText = "Mute My Mic";
                selfMicBtn.classList.remove('muted');
            }
        }

        function initiatePeerConnection(targetSocketId, targetUsername, isInitiator) {
            if (peers[targetSocketId]) return;

            const pc = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', {
                        targetSocketId: targetSocketId,
                        signalData: { candidate: event.candidate }
                    });
                }
            };

            pc.ontrack = (event) => {
                let audio = document.getElementById(`audio-${targetSocketId}`);
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = `audio-${targetSocketId}`;
                    audio.autoplay = true;
                    document.body.appendChild(audio);
                }
                audio.srcObject = event.streams[0];

                peers[targetSocketId].audioEl = audio;
                updatePeerUI();
            };

            peers[targetSocketId] = {
                pc: pc,
                username: targetUsername,
                audioEl: null,
                isMuted: false,
                volume: 1.0
            };

            updatePeerUI();

            if (isInitiator) {
                pc.createOffer().then(offer => {
                    return pc.setLocalDescription(offer);
                }).then(() => {
                    socket.emit('signal', {
                        targetSocketId: targetSocketId,
                        signalData: { sdp: pc.localDescription }
                    });
                });
            }
        }

        function toggleMutePeer(socketId) {
            if (peers[socketId]) {
                peers[socketId].isMuted = !peers[socketId].isMuted;
                applyAudioSettings(socketId);
                updatePeerUI();
            }
        }

        function setPeerVolume(socketId, val) {
            if (peers[socketId]) {
                peers[socketId].volume = parseFloat(val);
                applyAudioSettings(socketId);
                const label = document.getElementById(`vol-label-${socketId}`);
                if (label) label.innerText = `${Math.round(val * 100)}%`;
            }
        }

        function applyAudioSettings(socketId) {
            const peer = peers[socketId];
            if (peer && peer.audioEl) {
                peer.audioEl.muted = peer.isMuted;
                // Standard volume ranges from 0.0 to 1.0
                peer.audioEl.volume = Math.min(1.0, peer.volume);
            }
        }

        function updatePeerUI() {
            const peerList = Object.entries(peers);
            if (peerList.length === 0) {
                peersContainer.innerHTML = "<span style='color:#aaa;'>Waiting for others to join...</span>";
                return;
            }

            peersContainer.innerHTML = peerList.map(([sId, peer]) => `
                <div class="peer-item">
                    <div class="peer-header">
                        <span><strong>${peer.username}</strong></span>
                        <button class="mute-btn ${peer.isMuted ? 'muted' : ''}" onclick="toggleMutePeer('${sId}')">
                            ${peer.isMuted ? 'Unmute' : 'Mute'}
                        </button>
                    </div>
                    <div class="peer-controls">
                        <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="${peer.volume}" oninput="setPeerVolume('${sId}', this.value)">
                        <span id="vol-label-${sId}" class="volume-label">${Math.round(peer.volume * 100)}%</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
