<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proximity Voice Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .dashboard { width: 100%; max-width: 900px; background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 16px; }
        .status-badge { background-color: #1b4332; color: #52b788; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background-color: #52b788; border-radius: 50%; }
        .user-name { font-size: 1.2rem; font-weight: bold; margin-left: 12px; }
        
        /* Audio Visualizer Bar */
        .meter-container { margin-bottom: 20px; background: #252525; border: 1px solid #3a3a3a; padding: 12px; border-radius: 6px; }
        .meter-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; margin-bottom: 6px; }
        .meter-bar-bg { width: 100%; height: 12px; background: #111; border-radius: 6px; overflow: hidden; }
        .meter-bar-fill { width: 0%; height: 100%; background: #52b788; transition: width 0.05s ease; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .card { background-color: #252525; border: 1px solid #3a3a3a; border-radius: 6px; padding: 16px; min-height: 220px; }
        .card-title { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        ul { list-style: none; }
        li { background-color: #2a2a2a; padding: 10px 14px; border-radius: 4px; margin-bottom: 8px; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
        .peer-header { display: flex; justify-content: space-between; align-items: center; }
        .peer-controls { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #aaa; }
        input[type="range"] { accent-color: #52b788; }
        .controls { display: flex; gap: 12px; justify-content: flex-end; }
        button { background-color: #333; color: white; border: 1px solid #555; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .debug-box { width: 100%; max-width: 900px; background: #000; border: 1px solid #444; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.8rem; color: #00ff00; height: 120px; overflow-y: auto; margin-top: 10px; }
        .debug-entry { margin-bottom: 4px; }
        .debug-error { color: #ff4d4d; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div>
            <span class="status-badge"><span class="status-dot" id="status-dot"></span> <span id="conn-status">Connecting...</span></span>
            <span class="user-name" id="user-display">Loading...</span>
        </div>
        <div style="color: #52b788; font-weight: bold; font-size: 0.9rem;" id="mic-status">● Checking Mic...</div>
    </div>

    <!-- Live Microphone Level Bar -->
    <div class="meter-container">
        <div class="meter-label">Live Voice Input Level</div>
        <div class="meter-bar-bg">
            <div class="meter-bar-fill" id="mic-bar"></div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-title">Active Voice Peers</div>
            <ul id="active-peers"></ul>
        </div>
        <div class="card">
            <div class="card-title">Connected Roster</div>
            <ul id="roster-list"></ul>
        </div>
    </div>

    <div class="controls">
        <button id="mute-btn" onclick="toggleMute()">Mute Mic</button>
    </div>
</div>

<div class="debug-box" id="debug-log">
    <div class="debug-entry">[SYSTEM] Diagnostic log initialized.</div>
</div>

<script>
    function log(msg, isError = false) {
        const box = document.getElementById('debug-log');
        const div = document.createElement('div');
        div.className = isError ? 'debug-entry debug-error' : 'debug-entry';
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('user') || 'Anonymous';
    document.getElementById('user-display').innerText = username;

    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProtocol}//${window.location.host}?user=${encodeURIComponent(username)}`;
    log(`Connecting to WebSocket: ${wsUrl}`);

    let ws = new WebSocket(wsUrl);
    let localStream = null;
    let isMuted = false;
    const peerConnections = {};
    const peerAudioElements = {};

    ws.onopen = () => {
        log("WebSocket connection established!");
        document.getElementById('conn-status').innerText = "Connected";
    };

    ws.onerror = () => log("WebSocket error occurred!", true);
    ws.onclose = () => {
        log("WebSocket connection closed.", true);
        document.getElementById('conn-status').innerText = "Disconnected";
        document.getElementById('status-dot').style.backgroundColor = "#ff4d4d";
    };

    // Microphone Setup + Audio Visualizer
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(stream => {
            localStream = stream;
            log("Microphone access granted.");
            document.getElementById('mic-status').innerHTML = '● Microphone Active';

            // Audio Context for Voice Level Bar
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 64;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function updateMicMeter() {
                if (!isMuted) {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let average = sum / dataArray.length;
                    let percentage = Math.min(100, Math.max(0, (average / 128) * 100));
                    document.getElementById('mic-bar').style.width = percentage + '%';
                } else {
                    document.getElementById('mic-bar').style.width = '0%';
                }
                requestAnimationFrame(updateMicMeter);
            }
            updateMicMeter();
        })
        .catch(err => {
            log(`Mic error: ${err.message}`, true);
            document.getElementById('mic-status').style.color = '#dc3545';
            document.getElementById('mic-status').innerHTML = '● Mic Access Denied';
        });

    // Handle Signaling and Roster Updates
    ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'roster') {
            log(`Roster updated: ${data.players.length} players online.`);
            const rosterList = document.getElementById('roster-list');
            rosterList.innerHTML = '';
            
            data.players.filter(p => p.username !== username).forEach(peer => {
                const li = document.createElement('li');
                const statusColor = peer.status === 'muted' ? '#ff4d4d' : '#52b788';
                li.innerHTML = `
                    <div class="peer-header">
                        <span>${peer.username}</span>
                        <span style="font-size:0.75rem; color:${statusColor};">● ${peer.status}</span>
                    </div>`;
                rosterList.appendChild(li);

                if (!peerConnections[peer.username]) {
                    createPeerConnection(peer.username, true);
                }
            });
        }

        if (data.sender) {
            if (!peerConnections[data.sender]) createPeerConnection(data.sender, false);
            const pc = peerConnections[data.sender];

            if (data.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({ target: data.sender, type: 'answer', payload: answer }));
            } else if (data.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
            } else if (data.type === 'candidate') {
                await pc.addIceCandidate(new RTCIceCandidate(data.payload));
            }
        }
    };

    function createPeerConnection(peer, isInitiator) {
        log(`Initializing WebRTC Peer Connection with: ${peer}`);
        const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });
        peerConnections[peer] = pc;

        if (localStream) {
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        pc.ontrack = (event) => {
            log(`Receiving audio stream from: ${peer}`);
            let audio = peerAudioElements[peer];
            if (!audio) {
                audio = document.createElement('audio');
                audio.autoplay = true;
                peerAudioElements[peer] = audio;
                document.body.appendChild(audio);
            }
            audio.srcObject = event.streams[0];

            // Render Peer Volume Control Card
            const activeList = document.getElementById('active-peers');
            if (!document.getElementById(`card-${peer}`)) {
                const li = document.createElement('li');
                li.id = `card-${peer}`;
                li.innerHTML = `
                    <div class="peer-header">
                        <span>${peer}</span>
                        <span style="font-size:0.75rem; color:#52b788;">Streaming</span>
                    </div>
                    <div class="peer-controls">
                        <label>Volume:</label>
                        <input type="range" min="0" max="1" step="0.05" value="1" oninput="setPeerVolume('${peer}', this.value)">
                    </div>`;
                activeList.appendChild(li);
            }
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({ target: peer, type: 'candidate', payload: event.candidate }));
            }
        };

        if (isInitiator) {
            pc.createOffer().then(offer => {
                pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ target: peer, type: 'offer', payload: offer }));
            });
        }
    }

    function setPeerVolume(peer, value) {
        if (peerAudioElements[peer]) {
            peerAudioElements[peer].volume = parseFloat(value);
        }
    }

    function toggleMute() {
        if (!localStream) return;
        isMuted = !isMuted;
        localStream.getAudioTracks()[0].enabled = !isMuted;
        
        const btn = document.getElementById('mute-btn');
        btn.innerText = isMuted ? 'Unmute Mic' : 'Mute Mic';
        btn.style.backgroundColor = isMuted ? '#856404' : '#333';

        log(isMuted ? "Microphone muted" : "Microphone unmuted");

        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: 'status_change',
                status: isMuted ? 'muted' : 'unmuted'
            }));
        }
    }
</script>

</body>
</html>
