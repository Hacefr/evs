<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proximity Voice Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; max-width: 450px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .status { font-weight: bold; margin-top: 15px; font-size: 1.1em; }
        .connected { color: #4CAF50; }
        .error { color: #f44336; }
        .peer-list { margin-top: 25px; text-align: left; }
        .peer-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; }
        .mute-btn { background: #f44336; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .mute-btn.muted { background: #4CAF50; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Proximity Voice Chat</h2>
        <div id="status" class="status">Connecting to voice channel...</div>
        <div class="peer-list">
            <h3>Connected Players</h3>
            <div id="peersContainer">Waiting for others to join...</div>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const peersContainer = document.getElementById('peersContainer');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let myUsername = "";
        let localStream = null;
        let socket = null;
        
        let myPosition = { x: 0, y: 0, z: 0, world: "world" };
        const playerPositions = {}; // username -> { x, y, z, world }
        const peers = {}; // socketId -> { pc, username, audioEl, isMuted }

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        if (!token) {
            statusDiv.className = "status error";
            statusDiv.innerText = "Error: Invalid link. Run /voice in-game.";
        } else {
            fetch('/api/auth/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
            .then(res => res.json())
            .then(async data => {
                if (!data.valid) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Error: Token expired. Run /voice in-game for a new link.";
                    return;
                }

                myUsername = data.username;
                statusDiv.className = "status connected";
                statusDiv.innerText = `Connected as ${myUsername}`;

                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (err) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Microphone access denied!";
                    return;
                }

                socket = io({
                    auth: { username: myUsername }
                });

                socket.on('all_peers', (peerList) => {
                    peerList.forEach(({ socketId, username }) => {
                        initiatePeerConnection(socketId, username, true);
                    });
                });

                socket.on('peer_joined', ({ username, socketId }) => {
                    initiatePeerConnection(socketId, username, false);
                });

                socket.on('signal', async ({ senderSocketId, senderUsername, signalData }) => {
                    if (!peers[senderSocketId]) {
                        initiatePeerConnection(senderSocketId, senderUsername, false);
                    }

                    const pc = peers[senderSocketId].pc;

                    try {
                        if (signalData.sdp) {
                            await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp));
                            if (signalData.sdp.type === 'offer') {
                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);
                                socket.emit('signal', {
                                    targetSocketId: senderSocketId,
                                    signalData: { sdp: pc.localDescription }
                                });
                            }
                        } else if (signalData.candidate) {
                            await pc.addIceCandidate(new RTCIceCandidate(signalData.candidate));
                        }
                    } catch (e) {
                        console.error("Signaling error:", e);
                    }
                });

                // Real-time Position Listener for Proximity Audio Calculation
                socket.on('position_update', ({ username, position }) => {
                    playerPositions[username] = position;
                    if (username === myUsername) {
                        myPosition = position;
                    }
                    updateProximityAudio();
                });

                socket.on('peer_left', ({ socketId }) => {
                    if (peers[socketId]) {
                        if (peers[socketId].audioEl) peers[socketId].audioEl.remove();
                        peers[socketId].pc.close();
                        delete peers[socketId];
                        updatePeerUI();
                    }
                });
            })
            .catch(() => {
                statusDiv.className = "status error";
                statusDiv.innerText = "Server connection error.";
            });
        }

        function initiatePeerConnection(targetSocketId, targetUsername, isInitiator) {
            if (peers[targetSocketId]) return;

            const pc = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', {
                        targetSocketId: targetSocketId,
                        signalData: { candidate: event.candidate }
                    });
                }
            };

            pc.ontrack = (event) => {
                let audio = document.getElementById(`audio-${targetSocketId}`);
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = `audio-${targetSocketId}`;
                    audio.autoplay = true;
                    document.body.appendChild(audio);
                }
                audio.srcObject = event.streams[0];

                peers[targetSocketId].audioEl = audio;
                updatePeerUI();
            };

            peers[targetSocketId] = {
                pc: pc,
                username: targetUsername,
                audioEl: null,
                isMuted: false
            };

            updatePeerUI();

            if (isInitiator) {
                pc.createOffer().then(offer => {
                    return pc.setLocalDescription(offer);
                }).then(() => {
                    socket.emit('signal', {
                        targetSocketId: targetSocketId,
                        signalData: { sdp: pc.localDescription }
                    });
                });
            }
        }

        function toggleMutePeer(socketId) {
            if (peers[socketId]) {
                peers[socketId].isMuted = !peers[socketId].isMuted;
                if (peers[socketId].audioEl) {
                    peers[socketId].audioEl.muted = peers[socketId].isMuted;
                }
                updatePeerUI();
            }
        }

        function updatePeerUI() {
            const peerList = Object.entries(peers);
            if (peerList.length === 0) {
                peersContainer.innerHTML = "<span style='color:#aaa;'>Waiting for others to join...</span>";
                return;
            }

            peersContainer.innerHTML = peerList.map(([sId, peer]) => `
                <div class="peer-item">
                    <span><strong>${peer.username}</strong></span>
                    <button class="mute-btn ${peer.isMuted ? 'muted' : ''}" onclick="toggleMutePeer('${sId}')">
                        ${peer.isMuted ? 'Unmute' : 'Mute'}
                    </button>
                </div>
            `).join('');
        }

        function updateProximityAudio() {
            const MAX_DISTANCE = 30; // Maximum hearing distance in blocks

            Object.values(peers).forEach(peer => {
                if (peer.isMuted || !peer.audioEl) return;

                const targetPos = playerPositions[peer.username];
                if (!targetPos || targetPos.world !== myPosition.world) {
                    peer.audioEl.volume = 0;
                    return;
                }

                const dx = targetPos.x - myPosition.x;
                const dy = targetPos.y - myPosition.y;
                const dz = targetPos.z - myPosition.z;
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (distance >= MAX_DISTANCE) {
                    peer.audioEl.volume = 0;
                } else {
                    // Linear drop-off: 100% volume standing next to them, down to 0% at 30 blocks
                    peer.audioEl.volume = Math.max(0, 1 - (distance / MAX_DISTANCE));
                }
            });
        }
    </script>
</body>
</html>
