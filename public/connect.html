<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proximity Voice Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; max-width: 400px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .status { font-weight: bold; margin-top: 15px; font-size: 1.1em; }
        .connected { color: #4CAF50; }
        .error { color: #f44336; }
        .active-users { margin-top: 20px; font-size: 0.9em; color: #aaa; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Proximity Voice Chat</h2>
        <div id="status" class="status">Connecting to voice channel...</div>
        <div id="peers" class="active-users">Connected Players: Waiting for others...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const peersDiv = document.getElementById('peers');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let myUsername = "";
        let localStream = null;
        let socket = null;
        
        // socketId -> { pc, username, audioEl }
        const peers = {};

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        if (!token) {
            statusDiv.className = "status error";
            statusDiv.innerText = "Error: Invalid link. Run /voice in-game.";
        } else {
            fetch('/api/auth/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
            .then(res => res.json())
            .then(async data => {
                if (!data.valid) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Error: Token expired. Run /voice in-game for a new link.";
                    return;
                }

                myUsername = data.username;
                statusDiv.className = "status connected";
                statusDiv.innerText = `Connected as ${myUsername}`;

                // Request microphone access
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (err) {
                    statusDiv.className = "status error";
                    statusDiv.innerText = "Microphone access denied! Allow mic access in browser.";
                    return;
                }

                socket = io({
                    auth: { username: myUsername }
                });

                // Receive list of existing users in room
                socket.on('all_peers', (peerList) => {
                    peerList.forEach(({ socketId, username }) => {
                        initiatePeerConnection(socketId, username, true);
                    });
                });

                // New player connected
                socket.on('peer_joined', ({ username, socketId }) => {
                    initiatePeerConnection(socketId, username, false);
                });

                // Handle signaling messages (Offers, Answers, ICE Candidates)
                socket.on('signal', async ({ senderSocketId, senderUsername, signalData }) => {
                    if (!peers[senderSocketId]) {
                        initiatePeerConnection(senderSocketId, senderUsername, false);
                    }

                    const pc = peers[senderSocketId].pc;

                    try {
                        if (signalData.sdp) {
                            await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp));
                            if (signalData.sdp.type === 'offer') {
                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);
                                socket.emit('signal', {
                                    targetSocketId: senderSocketId,
                                    signalData: { sdp: pc.localDescription }
                                });
                            }
                        } else if (signalData.candidate) {
                            await pc.addIceCandidate(new RTCIceCandidate(signalData.candidate));
                        }
                    } catch (e) {
                        console.error("Signaling error:", e);
                    }
                });

                // Player left
                socket.on('peer_left', ({ socketId }) => {
                    if (peers[socketId]) {
                        if (peers[socketId].audioEl) peers[socketId].audioEl.remove();
                        peers[socketId].pc.close();
                        delete peers[socketId];
                        updatePeerList();
                    }
                });
            })
            .catch(() => {
                statusDiv.className = "status error";
                statusDiv.innerText = "Server connection error.";
            });
        }

        function initiatePeerConnection(targetSocketId, targetUsername, isInitiator) {
            if (peers[targetSocketId]) return;

            const pc = new RTCPeerConnection(rtcConfig);

            // Add local mic stream
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', {
                        targetSocketId: targetSocketId,
                        signalData: { candidate: event.candidate }
                    });
                }
            };

            // Receive remote audio track
            pc.ontrack = (event) => {
                let audio = document.getElementById(`audio-${targetSocketId}`);
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = `audio-${targetSocketId}`;
                    audio.autoplay = true;
                    document.body.appendChild(audio);
                }
                audio.srcObject = event.streams[0];

                peers[targetSocketId].audioEl = audio;
                updatePeerList();
            };

            peers[targetSocketId] = {
                pc: pc,
                username: targetUsername,
                audioEl: null
            };

            updatePeerList();

            // Create initial offer if initiator
            if (isInitiator) {
                pc.createOffer().then(offer => {
                    return pc.setLocalDescription(offer);
                }).then(() => {
                    socket.emit('signal', {
                        targetSocketId: targetSocketId,
                        signalData: { sdp: pc.localDescription }
                    });
                }).catch(err => console.error("Offer creation error:", err));
            }
        }

        function updatePeerList() {
            const activeList = Object.values(peers).map(p => p.username);
            peersDiv.innerText = activeList.length > 0 
                ? "Active Players: " + activeList.join(", ") 
                : "Connected Players: Waiting for others...";
        }
    </script>
</body>
</html>
